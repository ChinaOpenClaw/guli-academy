#服务端口
server.port=8130
#服务名
spring.application.name=mad-aliyunoss

#环境设置：dev、test、prod
spring.profiles.active=dev


#阿里云 OSS
#不同的服务器，地址不同
# 出于安全考虑，密钥请通过环境变量注入，不要把真实凭据提交到仓库
aliyun.oss.file.endpoint=oss-cn-beijing.aliyuncs.com
aliyun.oss.file.keyid=${ALIYUN_OSS_KEYID:请配置你的阿里云AccessKeyId}
aliyun.oss.file.keysecret=${ALIYUN_OSS_KEYSECRET:请配置你的阿里云AccessKeySecret}
#bucket可以在控制台创建，也可以使用java代码创建
aliyun.oss.file.bucketname=mad-file-sz190105
aliyun.oss.file.filehost=avatar
