# 服务端口
server.port=8160
# 服务名
spring.application.name=mad-vod

# 环境设置：dev、test、prod
spring.profiles.active=dev

#阿里云 vod
#不同的服务器，地址不同
# 出于安全考虑，密钥请通过环境变量注入，不要把真实凭据提交到仓库
aliyun.vod.file.keyid=${ALIYUN_VOD_KEYID:请配置你的阿里云AccessKeyId}
aliyun.vod.file.keysecret=${ALIYUN_VOD_KEYSECRET:请配置你的阿里云AccessKeySecret}

# 最大上传单个文件大小：默认1M
spring.servlet.multipart.max-file-size=1024MB
# 最大置总上传的数据大小 ：默认10M
spring.servlet.multipart.max-request-size=1024MB