<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7fa394"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b9c6bf"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cfe6dc;stroke-width:1.5;}
      .boxC{fill:#eef6fb;stroke:#bcd9ec;stroke-width:1.5;}
      .boxS{fill:#fff8ef;stroke:#f0d8b4;stroke-width:1.5;}
      .boxE{fill:#eafaf3;stroke:#68cb9b;stroke-width:1.5;}
      .ttl{fill:#1f2d3d;font-size:15px;font-weight:700;}
      .sub{fill:#5b6b73;font-size:11px;}
      .lab{fill:#2a3a44;font-size:12px;font-weight:600;}
      .legend{fill:#5b6b73;font-size:11px;}
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="url(#bg)"/>
  <text x="40" y="42" class="ttl" font-size="20" fill="#1f2d3d">谷粒学院 · 在线教学平台 — 系统架构图</text>
  <text x="40" y="62" class="sub" font-size="12">Guli Academy · 开源在线教育平台（前台门户 + 后台管理 + Spring Cloud 微服务 + 阿里云 VOD/OSS）</text>

  <!-- Clients -->
  <rect x="55" y="92" width="300" height="78" rx="10" class="boxC"/>
  <text x="205" y="124" text-anchor="middle" class="lab" fill="#2f80b5">前台门户 guli-portal</text>
  <text x="205" y="146" text-anchor="middle" class="sub">Vue 3 + Vite + vue-router · 学员端</text>

  <rect x="625" y="92" width="300" height="78" rx="10" class="boxC"/>
  <text x="775" y="124" text-anchor="middle" class="lab" fill="#2f80b5">后台管理 guli-admin</text>
  <text x="775" y="146" text-anchor="middle" class="sub">Vue 2 + ElementUI · 课程/讲师/内容管理</text>

  <!-- Gateway -->
  <rect x="355" y="200" width="270" height="56" rx="10" class="box"/>
  <text x="490" y="224" text-anchor="middle" class="lab">API 网关 / 路由转发</text>
  <text x="490" y="243" text-anchor="middle" class="sub">Nginx · 同源代理 / 跨域 CORS</text>

  <!-- Eureka -->
  <rect x="370" y="276" width="240" height="40" rx="20" class="boxE"/>
  <text x="490" y="301" text-anchor="middle" class="lab" fill="#1f8f63">Eureka 服务注册中心</text>

  <!-- Microservices 3x2 -->
  <rect x="55"  y="336" width="270" height="64" rx="10" class="box"/>
  <text x="190" y="362" text-anchor="middle" class="lab">edu 课程服务</text>
  <text x="190" y="382" text-anchor="middle" class="sub">课程/讲师/章节/科目/视频关联</text>

  <rect x="355" y="336" width="270" height="64" rx="10" class="box"/>
  <text x="490" y="362" text-anchor="middle" class="lab">vod 视频服务</text>
  <text x="490" y="382" text-anchor="middle" class="sub">阿里云 VOD SDK · 上传/删除/凭证</text>

  <rect x="655" y="336" width="270" height="64" rx="10" class="box"/>
  <text x="790" y="362" text-anchor="middle" class="lab">oss 对象存储服务</text>
  <text x="790" y="382" text-anchor="middle" class="sub">阿里云 OSS · 封面/素材</text>

  <rect x="55"  y="416" width="270" height="64" rx="10" class="box"/>
  <text x="190" y="442" text-anchor="middle" class="lab">ucenter 用户中心</text>
  <text x="190" y="462" text-anchor="middle" class="sub">会员/订单/学习记录</text>

  <rect x="355" y="416" width="270" height="64" rx="10" class="box"/>
  <text x="490" y="442" text-anchor="middle" class="lab">statistics 统计服务</text>
  <text x="490" y="462" text-anchor="middle" class="sub">每日注册/播放/活跃统计</text>

  <rect x="655" y="416" width="270" height="64" rx="10" class="box"/>
  <text x="790" y="442" text-anchor="middle" class="lab">sysuser 登录鉴权</text>
  <text x="790" y="462" text-anchor="middle" class="sub">JWT / 统一登录 token</text>

  <!-- Storage -->
  <rect x="55"  y="520" width="200" height="60" rx="10" class="boxS"/>
  <text x="155" y="546" text-anchor="middle" class="lab">MySQL</text>
  <text x="155" y="565" text-anchor="middle" class="sub">业务主库 guli_edu</text>

  <rect x="290" y="520" width="200" height="60" rx="10" class="boxS"/>
  <text x="390" y="546" text-anchor="middle" class="lab">Redis</text>
  <text x="390" y="565" text-anchor="middle" class="sub">缓存 / 统计计数</text>

  <rect x="525" y="520" width="200" height="60" rx="10" class="boxS"/>
  <text x="625" y="546" text-anchor="middle" class="lab">阿里云 VOD</text>
  <text x="625" y="565" text-anchor="middle" class="sub">视频存储 / 转码 / 播放</text>

  <rect x="760" y="520" width="180" height="60" rx="10" class="boxS"/>
  <text x="850" y="546" text-anchor="middle" class="lab">阿里云 OSS</text>
  <text x="850" y="565" text-anchor="middle" class="sub">静态资源</text>

  <!-- Arrows: clients -> gateway -->
  <line x1="205" y1="170" x2="430" y2="200" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775" y1="170" x2="550" y2="200" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- gateway -> services (to edu & vod & oss) -->
  <line x1="455" y1="256" x2="300" y2="336" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="256" x2="490" y2="336" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="256" x2="790" y2="336" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- services -> Eureka (dashed, register) -->
  <line x1="490" y1="336" x2="490" y2="316" stroke="#b9c6bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <line x1="190" y1="336" x2="430" y2="300" stroke="#b9c6bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <line x1="790" y1="336" x2="560" y2="300" stroke="#b9c6bf" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
  <!-- services -> storage -->
  <line x1="155" y1="400" x2="155" y2="520" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="400" x2="390" y2="520" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625" y1="400" x2="625" y2="520" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="400" x2="850" y2="520" stroke="#7fa394" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="700" y="612" width="14" height="14" rx="3" class="boxC"/><text x="722" y="623" class="legend">前端/客户端</text>
  <rect x="810" y="612" width="14" height="14" rx="3" class="box"/><text x="832" y="623" class="legend">微服务</text>
  <rect x="700" y="632" width="14" height="14" rx="3" class="boxS"/><text x="722" y="643" class="legend">存储/中间件</text>
  <rect x="810" y="632" width="14" height="14" rx="3" class="boxE"/><text x="832" y="643" class="legend">注册中心</text>
</svg>
